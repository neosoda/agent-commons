# One-shot recovery: publish ONLY the already validated v0.6.0 draft and its existing assets.
# The tag is created by publishing the draft; never replace an existing public release.
name: Publish validated v0.6.0 draft once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v060-once.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: agent-commons-release-v060
  cancel-in-progress: false

jobs:
  publish:
    name: Verify assets and publish existing release draft
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate exact-main CI, Chromium and Windows portable before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.6.0"
          test "$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')" = "$CURRENT_SHA"
          for attempt in $(seq 1 75); do
            runs="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$CURRENT_SHA&event=push&per_page=100")"
            result="$(printf '%s' "$runs" | jq -r --arg sha "$CURRENT_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and
                (.name == "CI" or .name == "Skill Hub browser QA" or .name == "Windows portable package"))] |
              if length == 3 and all(.[]; .conclusion == "success") then "success"
              elif any(.[]; .conclusion != null and .conclusion != "success") then "failure"
              else "pending" end')"
            if [ "$result" = failure ]; then echo "::error::Release gate failed"; exit 1; fi
            if [ "$result" = success ]; then
              ci_id="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.name == "CI") | .id' | head -1)"
              jobs="$(gh api "repos/$GH_REPO/actions/runs/$ci_id/jobs?per_page=100")"
              count="$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name | startswith("Test (")) | select(.conclusion == "success")] | length')"
              test "$count" = 6
              echo "Eight current-main release gates passed on $CURRENT_SHA"
              break
            fi
            if [ "$attempt" -eq 75 ]; then echo "::error::Timed out waiting for release gates"; exit 1; fi
            sleep 12
          done

          # The original release commit already passed all 8 main checks and rebuilt
          # the ZIP from scratch in workflow 44718700928, whose package/ZIP steps passed.
          ORIGINAL_SHA=7077d8c30648f1f3cc5ac9943c540201515788de
          original="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$ORIGINAL_SHA&event=push&per_page=100")"
          original_good="$(printf '%s' "$original" | jq -r --arg sha "$ORIGINAL_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and
              (.name == "CI" or .name == "Skill Hub browser QA" or .name == "Windows portable package") and
              .conclusion == "success")] | length')"
          test "$original_good" = 3
          ci_id="$(printf '%s' "$original" | jq -r '.workflow_runs[] | select(.name == "CI") | .id' | head -1)"
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$ci_id/jobs?per_page=100")"
          test "$(printf '%s' "$jobs" | jq '[.jobs[] | select(.name | startswith("Test (")) | select(.conclusion == "success")] | length')" = 6
          echo "Original v0.6.0 archive commit $ORIGINAL_SHA passed all release checks"

      - name: Validate immutable draft assets, publish and verify tag SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RELEASE_ID=452549123
          ORIGINAL_SHA=7077d8c30648f1f3cc5ac9943c540201515788de
          ZIP_SHA=a91f86614636b15b69b04c23ee6126920aed2a5ac7bdf69a1c7ce1cef9190404
          CHECKSUM_SHA=3e4f945a3a2a359fb120b78383cce19bea9827e37ac6f1f68e09595d725c158b
          release="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          echo "$release" | jq -e --arg sha "$ORIGINAL_SHA" '
            .tag_name == "v0.6.0" and .target_commitish == $sha and
            .prerelease == false and (.assets | length == 2)' >/dev/null
          echo "$release" | jq -e --arg hash "sha256:$ZIP_SHA" '
            any(.assets[]; .name == "AgentCommons-win-x64-portable.zip" and
              .digest == $hash and .size == 36600846 and .state == "uploaded")' >/dev/null
          echo "$release" | jq -e --arg hash "sha256:$CHECKSUM_SHA" '
            any(.assets[]; .name == "AgentCommons-win-x64-portable.zip.sha256" and
              .digest == $hash and .size == 101 and .state == "uploaded")' >/dev/null
          if [ "$(echo "$release" | jq -r '.draft')" = "true" ]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true >/dev/null
          fi
          published="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          echo "$published" | jq -e '.draft == false and .prerelease == false and
            .tag_name == "v0.6.0" and (.assets | length == 2)' >/dev/null
          tagsha="$(gh api "repos/$GH_REPO/git/ref/tags/v0.6.0" --jq '.object.sha')"
          test "$tagsha" = "$ORIGINAL_SHA"
          echo "PUBLISHED v0.6.0 at $ORIGINAL_SHA with existing checksum-verified ZIP"
