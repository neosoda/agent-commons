name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Git tag to publish (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @neosoda/agent-commons to npm (OIDC)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository at release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm CLI for OIDC Trusted Publishing (>= 11.5.1)
        run: |
          npm install -g npm@11.15.0
          echo "Using Node $(node -v) and npm $(npm -v)"

      - name: Verify Git tag, commit ancestry on main, and package.json version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch origin main --tags

          TARGET_TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ -z "$TARGET_TAG" ]]; then
            echo "::error::No release tag provided."
            exit 1
          fi

          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TARGET_TAG' does not match strict semver format vX.Y.Z."
            exit 1
          fi

          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$PKG_NAME" != "@neosoda/agent-commons" ]]; then
            echo "::error::Unexpected package name '$PKG_NAME' (expected '@neosoda/agent-commons')."
            exit 1
          fi

          if [[ "v${PKG_VERSION}" != "$TARGET_TAG" ]]; then
            echo "::error::Tag '$TARGET_TAG' does not match package.json version 'v${PKG_VERSION}'."
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$TARGET_TAG")"

          if [[ "$HEAD_SHA" != "$TAG_SHA" ]]; then
            echo "::error::HEAD ($HEAD_SHA) does not match tag '$TARGET_TAG' commit ($TAG_SHA)."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
            echo "::error::Commit $HEAD_SHA is not on origin/main. Refusing to publish unmerged ref."
            exit 1
          fi

          echo "Verified tag $TARGET_TAG == package.json v${PKG_VERSION} at main commit $HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and run automated test suite
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Inspect the actual npm tarball before publication
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          trap 'rm -f "$TARBALL"' EXIT
          CONTENTS="$(tar -tzf "$TARBALL")"
          for REQUIRED in package/dist/web/server.js package/dist/cli/index.js package/catalog/skills.json package/LICENSE; do
            if ! grep -Fqx "$REQUIRED" <<< "$CONTENTS"; then
              echo "::error::Missing required published file: $REQUIRED"
              exit 1
            fi
          done
          echo "Verified shipped UI, CLI, catalog and license in $TARBALL"

      - name: Publish to npm via OIDC Trusted Publishing with Provenance
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          EXISTING_VERSION="$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || true)"
          if [[ "$EXISTING_VERSION" == "$PKG_VERSION" ]]; then
            echo "Package ${PKG_NAME}@${PKG_VERSION} is already published on npm. Skipping duplicate publish."
            exit 0
          fi

          npm publish --provenance --access public
