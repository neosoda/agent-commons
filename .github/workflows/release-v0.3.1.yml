name: Publish verified Agent Commons v0.3.1

# GITHUB_TOKEN releases do not trigger release.published downstream workflows.
# Attach the already smoke-tested Windows ZIP directly in this one-shot bridge.
on:
  workflow_run:
    workflows: [CI, Skill Hub browser QA, Windows portable package]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-commons-v0.3.1-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Release exact validated main revision with ZIP and checksum
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.3.1
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify package, exact main, CI matrix, browser and portable jobs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          sha="$(git rev-parse HEAD)"
          remote="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [[ "$sha" != "$TRIGGER_SHA" || "$sha" != "$remote" ]]; then
            echo "Completed workflow is not at current main HEAD; skipping old revision."
            exit 0
          fi
          if [[ "$(jq -r '.version' package.json)" != "0.3.1" ||
                "$(jq -r '.version' package-lock.json)" != "0.3.1" ||
                "$(jq -r '.packages[""].version' package-lock.json)" != "0.3.1" ]]; then
            echo "Package/lock are not aligned to 0.3.1."
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "v0.3.1 already released; never overwrite."
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::v0.3.1 tag exists without a release. Manual review required."
            exit 1
          fi
          runs="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$sha&per_page=100")"
          for name in "CI" "Skill Hub browser QA" "Windows portable package"; do
            record="$(jq -r --arg name "$name" --arg sha "$sha" '
              [.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "push")]
              | sort_by(.id) | last
              | if . == null then "" else [.id, .status, .conclusion] | @tsv end
            ' <<< "$runs")"
            if [[ -z "$record" ]]; then
              echo "$name not scheduled yet; wait for the next completion."
              exit 0
            fi
            IFS=$'\t' read -r run_id status conclusion <<< "$record"
            if [[ "$status" != "completed" ]]; then
              echo "$name still $status; wait for the next completion."
              exit 0
            fi
            if [[ "$conclusion" != "success" ]]; then
              echo "::error::$name concluded $conclusion; refuse release."
              exit 1
            fi
            case "$name" in
              "CI") ci_run="$run_id" ;;
              "Skill Hub browser QA") browser_run="$run_id" ;;
              "Windows portable package") portable_run="$run_id" ;;
            esac
          done
          jobs="$(gh api "repos/$GH_REPO/actions/runs/$ci_run/jobs?per_page=100")"
          jq -e '.jobs | (length == 6) and
            (all(.[]; .status == "completed" and .conclusion == "success"
              and (.name | startswith("Test ("))))' <<< "$jobs" >/dev/null ||
            { echo "::error::All six matrix jobs must be successful."; exit 1; }
          artifact="$(gh api "repos/$GH_REPO/actions/runs/$portable_run/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "agent-commons-win-x64-portable" and (.expired | not)) | .id' | head -n 1)"
          if [[ -z "$artifact" ]]; then
            echo "::error::No Windows ZIP artifact from the validated run."
            exit 1
          fi
          echo "Exact release SHA $sha: CI=$ci_run, Chromium=$browser_run, Windows=$portable_run."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "portable_run=$portable_run" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the tested Windows ZIP and verify its checksum
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          PORTABLE_RUN: ${{ steps.gate.outputs.portable_run }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "$PORTABLE_RUN" --name agent-commons-win-x64-portable --dir release-assets
          test -s release-assets/AgentCommons-win-x64-portable.zip
          test -s release-assets/AgentCommons-win-x64-portable.zip.sha256
          (cd release-assets && sha256sum --check AgentCommons-win-x64-portable.zip.sha256)
          unzip -Z1 release-assets/AgentCommons-win-x64-portable.zip |
            grep -Eq '^AgentCommonsPortable/Start-AgentCommons\.cmd$'
          echo "PASS: extracted-build artifact, ZIP launcher and SHA-256 verified."

      - name: Create the public release with both Windows assets
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GH_REPO/branches/main" --jq '.commit.sha')"
          if [[ "$latest" != "$VERIFIED_SHA" ]]; then
            echo "::error::main changed after checks; refuse unverified release."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "::error::Release already exists; no clobber."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/AgentCommons-win-x64-portable.zip \
            release-assets/AgentCommons-win-x64-portable.zip.sha256 \
            --target "$VERIFIED_SHA" \
            --title "Agent Commons v0.3.1 — Local Skill Hub" \
            --notes-file docs/releases/v0.3.1-release-notes.md
          gh release view "$RELEASE_TAG" --json tagName,assets |
            jq -e '.tagName == "v0.3.1" and
              ([.assets[].name] | index("AgentCommons-win-x64-portable.zip") != null) and
              ([.assets[].name] | index("AgentCommons-win-x64-portable.zip.sha256") != null)'
          echo "Published v0.3.1 with exact verified Windows assets."
