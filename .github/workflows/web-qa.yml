name: Skill Hub browser QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Browser QA (Chromium)
    # Pin the OS supported by the browser test runner; ubuntu-latest currently resolves to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install project
        run: npm ci
      - name: Compile application
        run: npm run build
      - name: Install pinned browser test runner (not a runtime dependency)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Check real browser UX at five viewports
        run: node scripts/web-visual-smoke.mjs
      - name: Save anonymized browser screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-commons-web-qa
          path: artifacts/web-qa/
          if-no-files-found: ignore
          retention-days: 7
